schema_version: "1.0"
name: "LinkedIn Visual Companion"
objective: >-
  Create a visual asset that reinforces the post's idea and earns attention without
  repeating the whole post, inventing evidence, or looking like generic AI artwork.

format_policy:
  default: auto
  allowed:
    - single_image
    - carousel
  single_image_when:
    - "The post has one sharp idea, tension, metaphor, or memorable takeaway."
    - "A single visual can create recognition without needing a sequence."
  carousel_when:
    - "The idea benefits from progression, comparison, steps, layers, or several distinct takeaways."
    - "The reader gains value by moving through the idea one frame at a time."
  rule: >-
    Choose the format because it improves understanding or attention, not because one
    format is fashionable. Do not turn a one-point post into a padded carousel.

shared_style:
  - clean_editorial
  - modern_professional
  - visually_simple
  - one_clear_focal_idea
  - human_and_grounded
  - conceptual_when_literal_imagery_is_weak
  - designed_for_mobile_feed

hard_avoids:
  - "generic robot heads, glowing brains, humanoid AI assistants, or neon circuit clichés"
  - "floating dashboards, fake software interfaces, fake screenshots, or illegible UI"
  - "stock-photo handshake/business-team imagery unless the post genuinely requires people"
  - "random decorative technology symbols that do not explain the idea"
  - "embedded generated text, letters, logos, watermarks, or pseudo-typography inside AI imagery"
  - "invented charts, metrics, screenshots, quotations, or factual claims"
  - "visual clutter, multiple competing focal points, or excessive small detail"
  - "sensational imagery that overstates the post's actual stakes"

single_image:
  aspect_ratio: "4:5"
  overlay_text_max_words: 12
  rules:
    - "Use one visual metaphor or one concrete scene, not a collage of ideas."
    - "Keep any headline/overlay text outside the image-generation prompt so typography can be applied separately."
    - "The generation prompt should explicitly request no text, lettering, logos, or watermark."
    - "Prefer a visual that adds meaning instead of merely illustrating the first sentence literally."

carousel:
  aspect_ratio: "4:5"
  min_slides: 4
  max_slides: 8
  rules:
    - "Slide 1 earns the swipe with a clear, useful hook."
    - "Each slide advances the idea; do not repeat the post sentence by sentence."
    - "Use concise slide copy that can be typeset by a deterministic layout layer later."
    - "Keep a consistent visual system across all slides."
    - "Do not ask an image model to render the finished slide typography."
    - "End with a useful takeaway or memorable distinction, not a forced engagement CTA."

rendering_boundary:
  planner_owns:
    - format recommendation
    - visual concept
    - overlay or slide copy
    - composition and art direction
    - provider-neutral generation prompt
    - alt text
  renderer_owns_later:
    - actual image generation
    - deterministic typography/layout
    - carousel slide rendering
    - output file creation
  orchestrator_owns:
    - human approval
    - scheduling
    - publishing
    - canonical post state
